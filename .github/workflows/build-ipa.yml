name: Build unsigned IPA

on:
  push:
    branches:
      - ipa-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for iOS devices (no code signing)
        run: |
          xcodebuild -project Moonlight.xcodeproj -scheme Moonlight \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "App bundle: $APP"
          test -n "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Moonlight-unsigned.ipa Payload
          ls -lh Moonlight-unsigned.ipa
          shasum -a 256 Moonlight-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: Moonlight-unsigned-ipa
          path: Moonlight-unsigned.ipa
          if-no-files-found: error
